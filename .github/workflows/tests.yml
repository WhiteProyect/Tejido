name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tejido
          POSTGRES_PASSWORD: tejido
          POSTGRES_DB: tejido
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tejido"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      # Postgres generico del propio job de CI, no Neon: aisla los tests de
      # produccion sin depender de un secreto de conexion real.
      DATABASE_URL: postgresql+psycopg://tejido:tejido@localhost:5432/tejido
      ENVIRONMENT: development
      LOG_LEVEL: INFO

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr tests
        run: pytest backend/tests_fastapi -v
