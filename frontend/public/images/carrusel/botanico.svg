<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" fill="none" stroke="#173f36" stroke-linecap="round" stroke-linejoin="round">
  <!-- Grabado botanico del carrusel (tema B "Ribera Editorial"): curvas de nivel del rio, ramas y hojas
       en linea fina; algunas hojas con relleno plano suave. Sin degradados ni imagenes. La columna del
       texto (x 60-660, y 200-700) y la franja del pie de la foto (x 600-1100, y 660-770) quedan casi despejadas (<= 10 % de opacidad) para conservar el AA. -->
  <defs>
    <g id="hoja">
      <path d="M0 0C18-22 58-26 90 0C58 26 18 22 0 0Z" />
      <path fill="none" d="M0 0H84M24 0l12-11M24 0l12 11M46 0l12-12M46 0l12 12M66 0l10-8M66 0l10 8" />
    </g>
    <g id="hoja-larga">
      <path d="M0 0C24-18 86-22 130 0C86 22 24 18 0 0Z" />
      <path fill="none" d="M0 0H124M30 0l14-10M30 0l14 10M58 0l14-11M58 0l14 11M88 0l12-8M88 0l12 8" />
    </g>
    <g id="rama">
      <path fill="none" d="M0 0C40-30 90-40 150-36S250-10 300 0" />
      <use href="#hoja" xlink:href="#hoja" transform="translate(52 -20) rotate(-62) scale(.8)" />
      <use href="#hoja" xlink:href="#hoja" transform="translate(70 -26) rotate(40) scale(.8)" />
      <use href="#hoja" xlink:href="#hoja" transform="translate(130 -36) rotate(-70) scale(.85)" />
      <use href="#hoja" xlink:href="#hoja" transform="translate(152 -36) rotate(28) scale(.85)" />
      <use href="#hoja" xlink:href="#hoja" transform="translate(214 -22) rotate(-55) scale(.75)" />
      <use href="#hoja" xlink:href="#hoja" transform="translate(236 -16) rotate(36) scale(.75)" />
      <use href="#hoja" xlink:href="#hoja" transform="translate(300 0) rotate(-8) scale(.7)" />
    </g>
    <g id="ramita">
      <path fill="none" d="M0 0C30-14 70-18 120-10" />
      <use href="#hoja" xlink:href="#hoja" transform="translate(40 -10) rotate(-58) scale(.7)" />
      <use href="#hoja" xlink:href="#hoja" transform="translate(66 -14) rotate(34) scale(.7)" />
      <use href="#hoja" xlink:href="#hoja" transform="translate(120 -10) rotate(-6) scale(.65)" />
    </g>
  </defs>

  <!-- Curvas de nivel / ondas del rio: arriba a la derecha (marcadas) y por el centro (tenues). -->
  <g stroke-width="1.4" stroke-opacity=".24">
    <path d="M520 40C640-6 760 120 900 82S1120 8 1230 70" />
    <path d="M540 66C656 22 770 146 906 108S1122 34 1230 96" />
    <path d="M560 92C672 50 780 172 912 134S1124 60 1230 122" />
    <path d="M590 118C690 80 790 198 918 160S1126 86 1230 148" />
    <path d="M626 144C710 110 800 224 924 186S1128 112 1230 174" />
    <path d="M668 170C734 142 812 250 930 212S1130 138 1230 200" />
    <path d="M820 300c60-30 130-26 190 6s130 30 200-6" />
    <path d="M830 326c62-28 128-22 186 8s128 28 194-8" />
    <path d="M850 352c58-24 120-18 176 10s122 24 184-10" />
  </g>
  <g stroke-width="1.2" stroke-opacity=".08">
    <path d="M-20 430C140 380 300 470 470 430S760 360 920 420 1120 470 1230 430" />
    <path d="M-20 462C140 412 300 502 470 462S760 392 920 452 1120 502 1230 462" />
    <path d="M-20 494C140 444 300 534 470 494S760 424 920 484 1120 534 1230 494" />
  </g>

  <!-- Ramas y hojas en linea: arriba al centro, borde derecho, esquina inferior derecha. -->
  <g stroke-width="1.6" stroke-opacity=".26">
    <use href="#rama" xlink:href="#rama" transform="translate(470 150) rotate(-14) scale(.9)" />
    <use href="#ramita" xlink:href="#ramita" transform="translate(700 70) rotate(-30)" />
    <use href="#rama" xlink:href="#rama" transform="translate(1185 120) rotate(118) scale(.85)" />
    <use href="#rama" xlink:href="#rama" transform="translate(1190 430) rotate(104) scale(.8)" />
    <use href="#ramita" xlink:href="#ramita" transform="translate(1120 360) rotate(150)" />
    <use href="#rama" xlink:href="#rama" transform="translate(820 905) rotate(-12) scale(.95)" />
    <use href="#rama" xlink:href="#rama" transform="translate(1195 900) rotate(-100) scale(.9)" />
    <use href="#ramita" xlink:href="#ramita" transform="translate(1000 870) rotate(-10)" />
    <use href="#hoja-larga" xlink:href="#hoja-larga" transform="translate(1040 640) rotate(-120)" />
    <use href="#hoja-larga" xlink:href="#hoja-larga" transform="translate(860 120) rotate(160) scale(.8)" />
  </g>
  <!-- Pocas en el borde izquierdo inferior (fuera de la columna del texto). -->
  <g stroke-width="1.6" stroke-opacity=".22">
    <use href="#ramita" xlink:href="#ramita" transform="translate(0 880) rotate(-52) scale(1.2)" />
    <use href="#hoja" xlink:href="#hoja" transform="translate(30 800) rotate(-80)" />
  </g>

  <!-- Hojas con relleno plano suave (dorado y menta). -->
  <g stroke-width="1.6" stroke-opacity=".24">
    <use href="#hoja-larga" xlink:href="#hoja-larga" fill="#d4a843" fill-opacity=".28" transform="translate(760 40) rotate(28) scale(.9)" />
    <use href="#hoja" xlink:href="#hoja" fill="#75b79b" fill-opacity=".26" transform="translate(1110 250) rotate(-140) scale(1.2)" />
    <use href="#hoja-larga" xlink:href="#hoja-larga" fill="#75b79b" fill-opacity=".24" transform="translate(1190 830) rotate(-160)" />
    <use href="#hoja" xlink:href="#hoja" fill="#d4a843" fill-opacity=".26" transform="translate(940 870) rotate(-40) scale(1.3)" />
    <use href="#hoja" xlink:href="#hoja" fill="#d4a843" fill-opacity=".22" transform="translate(120 900) rotate(-100) scale(1.1)" />
  </g>

  <!-- Semillas -->
  <g stroke-width="1.4" stroke-opacity=".24">
    <circle cx="1010" cy="250" r="5" />
    <circle cx="1030" cy="236" r="3.5" />
    <circle cx="640" cy="44" r="4" />
  </g>
</svg>
